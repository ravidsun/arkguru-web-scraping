domain_name: "example-domain"
phase2:
  seeds: ["https://example.com/docs"]
  out_path: "data/processed/web_chunks.jsonl"
  out_format: "jsonl"
  backend: "local"           # local (httpx+trafilatura) | firecrawl (cloud)
  firecrawl_api_key_env: "FIRECRAWL_API_KEY"
  max_pages: 200
  same_domain_only: true
  target_tokens: 550
  overlap_pct: 0.12
  min_content_chars: 200
  allow_path_prefixes: []    # e.g. ["/docs"] — empty means allow all paths
  deny_path_prefixes: []     # e.g. ["/blog", "/tag"]
  respect_robots: true
  crawl_delay_s: 0.25
  user_agent: "domain-rag/1.0"
  # --- datastore sink (optional; default writes JSONL/Parquet files) ---
  sink: "file"          # file | postgres  (connection/tables -> config/datastore.yaml)
  datastore_config: "config/datastore.yaml"
